<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#e0e0e0"/>

  <!-- Car body -->
  <rect x="52" y="288" width="408" height="118" rx="20" fill="#111"/>

  <!-- Cabin -->
  <path d="M138,288 L170,208 Q184,192 207,188 L305,188 Q328,192 342,208 L374,288Z" fill="#1c1c1c"/>

  <!-- Window -->
  <path d="M178,288 L203,228 Q214,213 229,210 L283,210 Q298,213 309,228 L334,288Z" fill="#4a7090" opacity="0.75"/>
  <!-- Window divider -->
  <rect x="252" y="210" width="8" height="78" fill="#111"/>

  <!-- TAXI roof sign -->
  <rect x="192" y="156" width="128" height="40" rx="8" fill="white"/>
  <text x="256" y="188" text-anchor="middle" font-family="Arial Black,Impact,sans-serif" font-size="27" font-weight="900" fill="#111" letter-spacing="1">TAXI</text>

  <!-- Headlights -->
  <rect x="56" y="338" width="60" height="24" rx="9" fill="#e8e8e8"/>
  <rect x="396" y="338" width="60" height="24" rx="9" fill="#e8e8e8"/>

  <!-- Wheels -->
  <circle cx="150" cy="414" r="54" fill="#0a0a0a"/>
  <circle cx="150" cy="414" r="30" fill="#2a2a2a"/>
  <circle cx="150" cy="414" r="12" fill="#555"/>
  <circle cx="362" cy="414" r="54" fill="#0a0a0a"/>
  <circle cx="362" cy="414" r="30" fill="#2a2a2a"/>
  <circle cx="362" cy="414" r="12" fill="#555"/>

  <!-- Foam on roof -->
  <circle cx="218" cy="194" r="24" fill="white"/>
  <circle cx="256" cy="188" r="20" fill="white"/>
  <circle cx="294" cy="193" r="22" fill="white"/>
  <circle cx="238" cy="173" r="15" fill="white"/>
  <circle cx="272" cy="170" r="13" fill="white"/>

  <!-- Right bubbles -->
  <circle cx="434" cy="236" r="30" fill="white"/>
  <circle cx="465" cy="194" r="19" fill="white"/>
  <circle cx="420" cy="192" r="16" fill="white"/>
  <circle cx="450" cy="164" r="12" fill="white"/>

  <!-- Left bubbles -->
  <circle cx="72" cy="246" r="26" fill="white"/>
  <circle cx="46" cy="208" r="17" fill="white"/>
  <circle cx="84" cy="204" r="14" fill="white"/>
  <circle cx="52" cy="178" r="10" fill="white"/>

  <!-- Water drops on car -->
  <ellipse cx="310" cy="258" rx="5" ry="10" fill="#7aaccc" opacity="0.6"/>
  <ellipse cx="280" cy="268" rx="4" ry="9" fill="#7aaccc" opacity="0.5"/>
  <ellipse cx="186" cy="255" rx="5" ry="10" fill="#7aaccc" opacity="0.6"/>
  <ellipse cx="218" cy="265" rx="4" ry="8" fill="#7aaccc" opacity="0.5"/>

  <!-- Water puddle -->
  <ellipse cx="256" cy="478" rx="190" ry="18" fill="#b0c8d8" opacity="0.5"/>
</svg>
